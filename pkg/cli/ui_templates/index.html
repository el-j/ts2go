<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS2Go - TypeScript to Go Transpiler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .toolbar {
            background: #f8f9fa;
            padding: 15px 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
        }

        .toolbar Button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .toolbar Button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .toolbar Button:active {
            transform: translateY(0);
        }

        .toolbar Button.secondary {
            background: #6c757d;
        }

        .toolbar Button.secondary:hover {
            background: #5a6268;
        }

        .toolbar .spacer {
            flex: 1;
        }

        .toolbar .status {
            color: #6c757d;
            font-size: 14px;
        }

        .toolbar .status.success {
            color: #28a745;
            font-weight: 600;
        }

        .toolbar .status.error {
            color: #dc3545;
            font-weight: 600;
        }

        .editor-container {
            display: flex;
            height: calc(100vh - 250px);
            min-height: 500px;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #dee2e6;
        }

        .editor-pane:last-child {
            border-right: none;
        }

        .editor-header {
            background: #f8f9fa;
            padding: 12px 20px;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .editor-header .lang-badge {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
        }

        .editor-header.go .lang-badge {
            background: #00ADD8;
        }

        .editor-content {
            flex: 1;
            overflow: auto;
        }

        Textarea, .output-code {
            width: 100%;
            height: 100%;
            border: none;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            background: #f8f9fa;
            color: #212529;
        }

        Textarea:focus {
            outline: none;
            background: #fff;
        }

        .output-code {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #f8f9fa;
            overflow-y: auto;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            margin: 20px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 16px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            background: #f8f9fa;
            padding: 15px 30px;
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            border-top: 1px solid #dee2e6;
        }

        .example-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .example-selector select {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .editor-container {
                flex-direction: column;
                height: auto;
            }

            .editor-pane {
                border-right: none;
                border-bottom: 1px solid #dee2e6;
                min-height: 400px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .toolbar {
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 TS2Go Desktop UI</h1>
            <p>Transpile TypeScript to Go in real-time</p>
        </div>

        <div class="toolbar">
            <Button onclick="transpile()" id="transpileBtn">▶ Transpile</Button>
            <Button onclick="clearAll()" class="secondary">🗑 Clear</Button>
            
            <div class="example-selector">
                <label for="examples">Examples:</label>
                <select id="examples" onchange="loadExample()">
                    <option value="">Select an example...</option>
                    <option value="interface">Interface Example</option>
                    <option value="class">Class Example</option>
                    <option value="function">Function Example</option>
                    <option value="enum">Enum Example</option>
                </select>
            </div>

            <div class="spacer"></div>
            <div class="status" id="status">Ready</div>
        </div>

        <div class="editor-container">
            <div class="editor-pane">
                <div class="editor-header">
                    <span class="lang-badge">TS</span>
                    TypeScript Input
                </div>
                <div class="editor-content">
                    <Textarea id="typescript-input" placeholder="Enter your TypeScript code here...">// Example TypeScript code
interface Person {
  name: string;
  age: number;
}

function greet(person: Person): string {
  return "Hello, " + person.name;
}

const user: Person = {
  name: "Alice",
  age: 30
};

console.log(greet(user));
</Textarea>
                </div>
            </div>

            <div class="editor-pane">
                <div class="editor-header go">
                    <span class="lang-badge">GO</span>
                    Generated Go Code
                </div>
                <div class="editor-content">
                    <div class="output-code" id="go-output">
                        <div class="loading">
                            <span>Click "Transpile" to generate Go code</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            Phase 21: Desktop UI Implementation | TS2Go v0.1.0 | Running on port {{.Port}}
        </div>
    </div>

    <script>
        const examples = {
            interface: `// Interface Example
interface User {
  id: number;
  name: string;
  email: string;
  active: boolean;
}

function createUser(name: string, email: string): User {
  return {
    id: Math.random(),
    name: name,
    email: email,
    active: true
  };
}`,
            class: `// Class Example
class Animal {
  private name: string;
  
  constructor(name: string) {
    this.name = name;
  }
  
  speak(): string {
    return this.name + " makes a sound";
  }
}

class Dog extends Animal {
  bark(): string {
    return this.speak() + " - Woof!";
  }
}`,
            function: `// Function Example
function add(a: number, b: number): number {
  return a + b;
}

function multiply(a: number, b: number): number {
  return a * b;
}

function calculate(x: number, y: number): number {
  const sum = add(x, y);
  const product = multiply(x, y);
  return sum + product;
}`,
            enum: `// Enum Example
enum Color {
  Red,
  Green,
  Blue
}

enum Status {
  Active = "active",
  Inactive = "inactive",
  Pending = "pending"
}

function getColorName(color: Color): string {
  return Color[color];
}`
        };

        function loadExample() {
            const select = document.getElementById('examples');
            const example = examples[select.value];
            if (example) {
                document.getElementById('typescript-input').value = example;
            }
        }

        function setStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function clearAll() {
            document.getElementById('typescript-input').value = '';
            document.getElementById('go-output').innerHTML = '<div class="loading"><span>Click "Transpile" to generate Go code</span></div>';
            setStatus('Ready');
        }

        async function transpile() {
            const typescript = document.getElementById('typescript-input').value;
            const outputDiv = document.getElementById('go-output');
            const btn = document.getElementById('transpileBtn');
            
            if (!typescript.trim()) {
                setStatus('Please enter TypeScript code', 'error');
                return;
            }

            btn.disabled = true;
            outputDiv.innerHTML = '<div class="loading"><div class="spinner"></div><span>Transpiling...</span></div>';
            setStatus('Transpiling...');

            try {
                const response = await fetch('/api/transpile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        typescript: typescript,
                        fileName: 'input.ts'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    outputDiv.textContent = data.go;
                    setStatus('✓ Transpilation successful', 'success');
                } else {
                    outputDiv.innerHTML = '<div class="error-message">Error: ' + (data.error || 'Unknown error') + '</div>';
                    setStatus('✗ Transpilation failed', 'error');
                }
            } catch (error) {
                outputDiv.innerHTML = '<div class="error-message">Network error: ' + error.message + '</div>';
                setStatus('✗ Network error', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // Allow Ctrl+Enter to transpile
        document.getElementById('typescript-input').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                transpile();
            }
        });
    </script>
</body>
</html>

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ts2go-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ts2go}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ts2go_saas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./saas/backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts2go"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ts2go-network

  # Redis for sessions and job queue
  redis:
    image: redis:7-alpine
    container_name: ts2go-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ts2go-network

  # MinIO for S3-compatible storage (development)
  minio:
    image: minio/minio:latest
    container_name: ts2go-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ts2go}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ts2go-network

  # API Server (Go)
  api:
    build:
      context: .
      dockerfile: saas/backend/api/Dockerfile
    container_name: ts2go-api
    environment:
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-ts2go}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ts2go_saas}?sslmode=disable
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Storage
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-ts2go}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ts2go-files}
      STORAGE_USE_SSL: "false"
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      # Server
      PORT: ${API_PORT:-8080}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./saas/backend:/app
    networks:
      - ts2go-network
    # Uncomment for hot reload in development
    # command: air -c .air.toml

  # Worker for transpilation jobs
  worker:
    build:
      context: .
      dockerfile: saas/backend/worker/Dockerfile
    container_name: ts2go-worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ts2go}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ts2go_saas}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-ts2go}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ts2go-files}
      STORAGE_USE_SSL: "false"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./saas/backend:/app
      - ./go:/transpiler  # Mount the transpiler
    networks:
      - ts2go-network

  # Frontend (Next.js) - Optional for development
  frontend:
    build:
      context: ./saas/frontend
      dockerfile: Dockerfile.dev
    container_name: ts2go-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./saas/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ts2go-network
    # Hot reload enabled by default in dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  ts2go-network:
    driver: bridge

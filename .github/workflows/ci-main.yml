name: CI - Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-quality:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: internal/transpiler/parser/package-lock.json

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Go mod verify
        run: go work sync && go mod verify

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Please run 'go fmt'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: |
          # Vet main modules (excludes examples which may have incomplete code)
          for dir in internal/transpiler internal/analyzer internal/mapper internal/module internal/orchestrator internal/project internal/tests pkg/cli pkg/optimizer cmd/ts2go runtime tests; do
            if [ -f "$dir/go.mod" ]; then
              echo "Vetting $dir..."
              (cd "$dir" && go vet ./...)
            fi
          done

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Build
        run: make build

      - name: Run tests with coverage
        run: |
          cd tests && go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./tests/coverage.txt
          flags: unittests
          name: codecov-main
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  build-all-platforms:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test-and-quality
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build
        run: make build

      - name: Test CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./ts2go.exe version
            ./ts2go.exe --help
          else
            ./ts2go version
            ./ts2go --help
          fi

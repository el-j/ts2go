name: Release Stable (Main Branch)

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci-*.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Step 1: Create the GitHub release with version tag and release notes
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -f VERSION ]; then
            # Use VERSION file if triggered by push (auto-version workflow)
            VERSION="v$(cat VERSION)"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            # Fallback to tag name
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version if it exists
            awk '/^## \[${{ steps.get_version.outputs.version }}\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md > RELEASE_NOTES.md || echo "Release ${{ steps.get_version.outputs.version }}" > RELEASE_NOTES.md
          else
            echo "Release ${{ steps.get_version.outputs.version }}" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See [documentation](https://github.com/${{ github.repository }}) for details." >> RELEASE_NOTES.md
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  # Step 2: Build CLI binaries for all platforms and upload to the release
  build-and-upload:
    name: Build & Upload - ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            platform: linux-arm64
            goos: linux
            goarch: arm64
          
          # macOS builds
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
          
          # Windows builds
          - os: windows-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          if [ "${{ matrix.goos }}" == "windows" ]; then
            OUTPUT_NAME="ts2go-${VERSION}-${{ matrix.platform }}.exe"
            go build -ldflags "-s -w -X main.version=${VERSION}" -o "${OUTPUT_NAME}" ./cmd/ts2go
          else
            OUTPUT_NAME="ts2go-${VERSION}-${{ matrix.platform }}"
            go build -ldflags "-s -w -X main.version=${VERSION}" -o "${OUTPUT_NAME}" ./cmd/ts2go
          fi
          
          # Create archive
          if [ "${{ matrix.goos }}" == "windows" ]; then
            7z a "ts2go-${VERSION}-${{ matrix.platform }}.zip" "${OUTPUT_NAME}" README.md LICENSE
            ASSET_PATH="ts2go-${VERSION}-${{ matrix.platform }}.zip"
          else
            tar czf "ts2go-${VERSION}-${{ matrix.platform }}.tar.gz" "${OUTPUT_NAME}" README.md
            ASSET_PATH="ts2go-${VERSION}-${{ matrix.platform }}.tar.gz"
          fi
          
          echo "ASSET_PATH=${ASSET_PATH}" >> $GITHUB_ENV
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ${{ env.ASSET_PATH }}

  # Step 3: Build Tauri desktop apps and upload to the same release
  # Waits for CLI builds to complete to ensure all artifacts are collected
  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}
    needs: [create-release, build-and-upload]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean workspace and caches
        shell: bash
        run: |
          echo "Cleaning workspace to prevent file conflicts..."
          rm -rf release/ dist/ build/
          rm -rf desktop-ui/dist desktop-ui/src-tauri/target
          rm -rf desktop-ui/src-tauri/bin
          rm -rf ~/go/pkg/mod/golang.org/toolchain* || true
          rm -rf ~/go/pkg/mod/cache/download/golang.org/toolchain* || true
          rm -rf ~/.cargo/registry || true
          rm -rf ~/.cargo/git || true
          echo "✓ Workspace cleaned"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            cmd/ts2go/go.mod
            cmd/ts2go/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop-ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Add macOS universal targets (explicit)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          echo "✓ macOS universal targets installed"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop-ui/src-tauri -> target'
          cache-on-failure: false
          key: ${{ matrix.platform }}-rust-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install parser dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build Desktop App using Makefile
        run: make build-desktop
        env:
          CARGO_INCREMENTAL: 0
          MACOSX_DEPLOYMENT_TARGET: '10.13'
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "Verifying build artifacts..."
          if [ "${{ matrix.platform }}" == "macos-latest" ]; then
            ls -lah release/stable/macos/ || (echo "macOS artifacts missing" && exit 1)
            echo "Checking for Node.js runtime:"
            if [ -d "desktop-ui/src-tauri/bin" ]; then
              ls -lh desktop-ui/src-tauri/bin/node* 2>/dev/null || echo "⚠️  Node.js not found in bin/"
            fi
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            ls -lah release/stable/windows/ || (echo "Windows artifacts missing" && exit 1)
          else
            ls -lah release/stable/linux/ || (echo "Linux artifacts missing" && exit 1)
          fi
          echo "Verifying build artifacts..."
          if [ "${{ matrix.platform }}" == "macos-latest" ]; then
            ls -lah release/stable/macos/ || (echo "macOS artifacts missing" && exit 1)
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            ls -lah release/stable/windows/ || (echo "Windows artifacts missing" && exit 1)
          else
            ls -lah release/stable/linux/ || (echo "Linux artifacts missing" && exit 1)
          fi

      - name: Upload Desktop artifacts to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            release/stable/macos/*
            release/stable/windows/*
            release/stable/linux/*

  # Step 4: Generate checksums for all CLI artifacts after all builds complete
  generate-checksums:
    name: Generate Checksums
    needs: [create-release, build-and-upload, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all CLI release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ needs.create-release.outputs.version }}
          fileName: "ts2go-*"
          
      - name: Generate checksums for all artifacts
        run: |
          sha256sum ts2go-*.tar.gz ts2go-*.zip > checksums.txt 2>/dev/null || true
          if [ -s checksums.txt ]; then
            cat checksums.txt
          else
            echo "No CLI artifacts found to checksum"
          fi
        shell: bash

      - name: Upload checksums
        if: hashFiles('checksums.txt') != ''
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: checksums.txt

  # Step 5: Deploy documentation to GitHub Pages (only for stable releases)
  deploy-docs:
    name: Deploy Documentation
    needs: [create-release, build-and-upload, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger docs deployment
        run: |
          echo "Triggering GitHub Pages deployment workflow"
          # The deploy-docs.yml workflow will handle the actual deployment
          # This is just a placeholder to track in release process

  # Step 6: Publish Docker images (only for tag-based releases)
  publish-docker:
    name: Publish Docker Image
    needs: [create-release, build-and-upload, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

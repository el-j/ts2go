name: Build Desktop App (All Platforms)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag for the build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the build'
        required: false
        type: string

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean workspace and caches
        shell: bash
        run: |
          echo "Cleaning workspace to prevent file conflicts..."
          # Clean build artifacts
          rm -rf release/ dist/ build/
          rm -rf desktop-ui/dist desktop-ui/src-tauri/target
          rm -rf desktop-ui/src-tauri/bin
          # Clean Go module cache entries that cause tar conflicts
          rm -rf ~/go/pkg/mod/golang.org/toolchain* || true
          rm -rf ~/go/pkg/mod/cache/download/golang.org/toolchain* || true
          # Clean Cargo registry to prevent conflicts
          rm -rf ~/.cargo/registry || true
          rm -rf ~/.cargo/git || true
          echo "✓ Workspace cleaned"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop-ui/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add additional Rust targets for macOS universal builds
        if: matrix.os_name == 'macos'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          echo "✓ macOS universal targets installed"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            cmd/ts2go/go.mod
            cmd/ts2go/go.sum

      - name: Verify installations
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Go version: $(go version)"
          echo "Rust version: $(rustc --version)"
          echo "Cargo version: $(cargo --version)"

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri
          cache-on-failure: false
          key: ${{ matrix.platform }}-rust-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Install desktop dependencies
        run: make install-desktop

      - name: Verify bundled resources preparation
        shell: bash
        run: |
          echo "Verifying required files exist before build..."
          test -f "mappings/npm-to-go.yaml" && echo "✓ mappings/npm-to-go.yaml exists" || (echo "✗ mappings file missing" && exit 1)
          test -f "internal/transpiler/parser/parser.js" && echo "✓ parser.js exists" || (echo "✗ parser.js missing" && exit 1)
          test -f "desktop-ui/package.json" && echo "✓ package.json exists" || (echo "✗ package.json missing" && exit 1)
          echo "✓ All required files present"

      - name: Build Desktop App using Makefile
        run: make build-desktop
        env:
          # Ensure clean environment for build
          CARGO_INCREMENTAL: 0
          # For macOS universal builds, Tauri handles this via its config
          MACOSX_DEPLOYMENT_TARGET: '10.13'

      - name: Verify build success
        shell: bash
        run: |
          echo "Verifying build artifacts..."
          if [ "${{ matrix.os_name }}" == "macos" ]; then
            if [ -d "release/stable/macos" ]; then
              echo "✓ macOS release directory exists"
              ls -lah release/stable/macos/
            else
              echo "✗ macOS release directory missing"
              echo "Checking Tauri output:"
              ls -R desktop-ui/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle output"
              exit 1
            fi
          elif [ "${{ matrix.os_name }}" == "windows" ]; then
            if [ -d "release/stable/windows" ]; then
              echo "✓ Windows release directory exists"
              ls -lah release/stable/windows/
            else
              echo "✗ Windows release directory missing"
              echo "Checking Tauri output:"
              ls -R desktop-ui/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle output"
              exit 1
            fi
          else
            if [ -d "release/stable/linux" ]; then
              echo "✓ Linux release directory exists"
              ls -lah release/stable/linux/
            else
              echo "✗ Linux release directory missing"
              echo "Checking Tauri output:"
              ls -R desktop-ui/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle output"
              exit 1
            fi
          fi

      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts created by Makefile:"
          ls -lah release/stable/${{ matrix.os_name }}/ 2>/dev/null || echo "No artifacts in expected location"
          echo ""
          echo "Checking Tauri output directory:"
          ls -lah desktop-ui/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle directory"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts2go-desktop-${{ matrix.os_name }}
          path: release/stable/${{ matrix.os_name }}/
          retention-days: 7
          if-no-files-found: error

      - name: Create release archives (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd release/stable/${{ matrix.os_name }}
          
          if [ "${{ matrix.os_name }}" == "macos" ]; then
            # Create a zip of the .app bundle for macOS
            zip -r "../../TS2Go-Desktop-v${VERSION}-macos.zip" *.app
            echo "Created: TS2Go-Desktop-v${VERSION}-macos.zip"
          elif [ "${{ matrix.os_name }}" == "windows" ]; then
            # Copy MSI directly (no need to re-archive installers)
            for file in *.msi *.exe; do
              if [ -f "$file" ]; then
                cp "$file" "../../$(basename "$file" | sed "s/\\.msi/-v${VERSION}.msi/" | sed "s/\\.exe/-v${VERSION}.exe/")"
                echo "Prepared: $file"
              fi
            done
          else
            # Create tar.gz with AppImage and deb for Linux
            tar czf "../../TS2Go-Desktop-v${VERSION}-linux.tar.gz" *.AppImage *.deb 2>/dev/null || \
            tar czf "../../TS2Go-Desktop-v${VERSION}-linux.tar.gz" *.AppImage 2>/dev/null || \
            echo "Warning: No Linux artifacts to archive"
            echo "Created: TS2Go-Desktop-v${VERSION}-linux.tar.gz"
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/TS2Go-Desktop-*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Create release summary
        run: |
          echo "✅ TS2Go Desktop built successfully for all platforms!"
          echo ""
          echo "Download artifacts:"
          echo "- macOS (Apple Silicon): TS2Go-Desktop-macos.zip"
          echo "- Windows (x64): TS2Go-Desktop-windows.zip"
          echo "- Linux (x64): TS2Go-Desktop-linux.tar.gz"

name: Build Desktop App (All Platforms)

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Verify installations
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Go version: $(go version)"
          echo "Rust version: $(rustc --version)"
          echo "Cargo version: $(cargo --version)"

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Install desktop dependencies
        run: make install-desktop

      - name: Build Desktop App using Makefile
        run: make build-desktop

      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts created by Makefile:"
          ls -lah release/stable/${{ matrix.os_name }}/ 2>/dev/null || echo "No artifacts in expected location"
          echo ""
          echo "Checking Tauri output directory:"
          ls -lah desktop-ui/src-tauri/target/release/bundle/ 2>/dev/null || echo "No bundle directory"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts2go-desktop-${{ matrix.os_name }}
          path: release/stable/${{ matrix.os_name }}/
          retention-days: 7
          if-no-files-found: error

      - name: Create release archives (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd release/stable/${{ matrix.os_name }}
          
          if [ "${{ matrix.os_name }}" == "macos" ]; then
            # Create a zip of the .app bundle for macOS
            zip -r "../../TS2Go-Desktop-v${VERSION}-macos.zip" *.app
            echo "Created: TS2Go-Desktop-v${VERSION}-macos.zip"
          elif [ "${{ matrix.os_name }}" == "windows" ]; then
            # Copy MSI directly (no need to re-archive installers)
            for file in *.msi *.exe; do
              if [ -f "$file" ]; then
                cp "$file" "../../$(basename "$file" | sed "s/\\.msi/-v${VERSION}.msi/" | sed "s/\\.exe/-v${VERSION}.exe/")"
                echo "Prepared: $file"
              fi
            done
          else
            # Create tar.gz with AppImage and deb for Linux
            tar czf "../../TS2Go-Desktop-v${VERSION}-linux.tar.gz" *.AppImage *.deb 2>/dev/null || \
            tar czf "../../TS2Go-Desktop-v${VERSION}-linux.tar.gz" *.AppImage 2>/dev/null || \
            echo "Warning: No Linux artifacts to archive"
            echo "Created: TS2Go-Desktop-v${VERSION}-linux.tar.gz"
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/TS2Go-Desktop-*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Create release summary
        run: |
          echo "✅ TS2Go Desktop built successfully for all platforms!"
          echo ""
          echo "Download artifacts:"
          echo "- macOS (Apple Silicon): TS2Go-Desktop-macos.zip"
          echo "- Windows (x64): TS2Go-Desktop-windows.zip"
          echo "- Linux (x64): TS2Go-Desktop-linux.tar.gz"

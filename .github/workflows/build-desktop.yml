name: Build Desktop App (All Platforms)

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Verify installations
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Go version: $(go version)"
          echo "Rust version: $(rustc --version)"
          echo "Cargo version: $(cargo --version)"

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install desktop dependencies
        working-directory: desktop-ui
        run: npm ci

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Build CLI (Unix)
        if: matrix.os_name != 'windows'
        run: make build-cli

      - name: Build CLI (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: go build -o ts2go.exe ./cmd/ts2go

      - name: Prepare bundled resources (Unix)
        if: matrix.os_name != 'windows'
        run: |
          mkdir -p desktop-ui/src-tauri/bin
          cp ts2go desktop-ui/src-tauri/bin/ts2go-cli
          mkdir -p desktop-ui/src-tauri/bin/parser
          cp -R internal/transpiler/parser/* desktop-ui/src-tauri/bin/parser/
          mkdir -p desktop-ui/src-tauri/bin/mappings
          cp -R mappings/* desktop-ui/src-tauri/bin/mappings/
          if command -v node >/dev/null 2>&1; then
            cp "$(command -v node)" desktop-ui/src-tauri/bin/node
            chmod +x desktop-ui/src-tauri/bin/node
          fi

      - name: Prepare bundled resources (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          mkdir -p desktop-ui/src-tauri/bin
          cp ts2go.exe desktop-ui/src-tauri/bin/ts2go-cli.exe
          mkdir -p desktop-ui/src-tauri/bin/parser
          cp -R internal/transpiler/parser/* desktop-ui/src-tauri/bin/parser/
          mkdir -p desktop-ui/src-tauri/bin/mappings
          cp -R mappings/* desktop-ui/src-tauri/bin/mappings/
          # Copy Node.js executable for Windows
          NODE_PATH=$(which node)
          if [ -f "$NODE_PATH" ]; then
            cp "$NODE_PATH" desktop-ui/src-tauri/bin/node.exe 2>/dev/null || \
            cp "${NODE_PATH}.exe" desktop-ui/src-tauri/bin/node.exe 2>/dev/null || \
            echo "Warning: Could not copy node.exe"
          fi

      - name: Build Desktop App
        working-directory: desktop-ui
        run: npm run tauri:build

      - name: Prepare release artifacts (macOS)
        if: matrix.os_name == 'macos'
        run: |
          mkdir -p release/stable/macos
          cp -R "desktop-ui/src-tauri/target/release/bundle/macos/TS2Go Desktop.app" release/stable/macos/

      - name: Prepare release artifacts (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          mkdir -p release/stable/windows
          cp desktop-ui/src-tauri/target/release/bundle/msi/*.msi release/stable/windows/ || true
          cp desktop-ui/src-tauri/target/release/bundle/nsis/*.exe release/stable/windows/ || true

      - name: Prepare release artifacts (Linux)
        if: matrix.os_name == 'linux'
        run: |
          mkdir -p release/stable/linux
          cp desktop-ui/src-tauri/target/release/bundle/appimage/*.AppImage release/stable/linux/ || true
          cp desktop-ui/src-tauri/target/release/bundle/deb/*.deb release/stable/linux/ || true

      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts:"
          ls -lah release/stable/${{ matrix.os_name }}/ || echo "No artifacts found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts2go-desktop-${{ matrix.os_name }}
          path: |
            release/stable/${{ matrix.os_name }}/*
          retention-days: 7

      - name: Create release archives (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd release/stable/${{ matrix.os_name }}
          if [ "${{ matrix.os_name }}" == "macos" ]; then
            zip -r ../../TS2Go-Desktop-${{ matrix.os_name }}.zip *.app
          elif [ "${{ matrix.os_name }}" == "windows" ]; then
            7z a ../../TS2Go-Desktop-${{ matrix.os_name }}.zip *.msi
          else
            tar czf ../../TS2Go-Desktop-${{ matrix.os_name }}.tar.gz *.AppImage *.deb
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/TS2Go-Desktop-${{ matrix.os_name }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Create release summary
        run: |
          echo "✅ TS2Go Desktop built successfully for all platforms!"
          echo ""
          echo "Download artifacts:"
          echo "- macOS (Apple Silicon): TS2Go-Desktop-macos.zip"
          echo "- Windows (x64): TS2Go-Desktop-windows.zip"
          echo "- Linux (x64): TS2Go-Desktop-linux.tar.gz"

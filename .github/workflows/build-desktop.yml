name: Build Desktop App (All Platforms)

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: make install-desktop

      - name: Build CLI
        run: make build-cli

      - name: Build Desktop App
        run: make build-desktop

      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts:"
          ls -lah release/stable/${{ matrix.os_name }}/ || echo "No artifacts found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ts2go-desktop-${{ matrix.os_name }}
          path: |
            release/stable/${{ matrix.os_name }}/*
          retention-days: 7

      - name: Create release archives (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd release/stable/${{ matrix.os_name }}
          if [ "${{ matrix.os_name }}" == "macos" ]; then
            zip -r ../../TS2Go-Desktop-${{ matrix.os_name }}.zip *.app
          elif [ "${{ matrix.os_name }}" == "windows" ]; then
            7z a ../../TS2Go-Desktop-${{ matrix.os_name }}.zip *.msi
          else
            tar czf ../../TS2Go-Desktop-${{ matrix.os_name }}.tar.gz *.AppImage *.deb
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/TS2Go-Desktop-${{ matrix.os_name }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Create release summary
        run: |
          echo "✅ TS2Go Desktop built successfully for all platforms!"
          echo ""
          echo "Download artifacts:"
          echo "- macOS (Apple Silicon): TS2Go-Desktop-macos.zip"
          echo "- Windows (x64): TS2Go-Desktop-windows.zip"
          echo "- Linux (x64): TS2Go-Desktop-linux.tar.gz"

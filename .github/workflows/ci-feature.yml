name: CI - Feature Branch

on:
  push:
    branches:
      - 'feature/**'
      - 'copilot/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: internal/transpiler/parser/package-lock.json

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Go mod verify
        run: go work sync && go mod verify
        working-directory: ./

      - name: Run go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Please run 'go fmt' on your code"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: make build

      - name: Run tests
        run: |
          cd tests && go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./tests/coverage.txt
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build-cross-platform:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build
        run: make build

      - name: Test CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./ts2go.exe --help
          else
            ./ts2go --help
          fi

name: Release Beta (Develop Branch)

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci-*.yml'

permissions:
  contents: write

jobs:
  create-beta-release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-release]')"
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create beta tag
        id: create_tag
        run: |
          # Get latest beta tag or start from 0
          LATEST_BETA=$(git tag -l "v*-beta.*" | sort -V | tail -n 1)
          if [ -z "$LATEST_BETA" ]; then
            LATEST_BETA="v0.0.0-beta.0"
          fi
          
          if [ "$LATEST_BETA" == "v0.0.0-beta.0" ]; then
            BETA_NUM=1
          else
            BETA_NUM=$(echo "$LATEST_BETA" | grep -oP 'beta\.\K\d+')
            BETA_NUM=$((BETA_NUM + 1))
          fi
          
          # Get short commit SHA
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Create beta version tag
          TAG_NAME="v0.1.0-beta.${BETA_NUM}.${SHORT_SHA}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Beta release from develop (${SHORT_SHA})"
          git push origin "${TAG_NAME}"

      - name: Generate changelog
        run: |
          echo "## Beta Release - ${{ steps.create_tag.outputs.tag_name }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Branch:** develop" >> RELEASE_NOTES.md
          echo "**Commit:** ${{ github.sha }}" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Changes" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          # Get commits since last beta tag
          LAST_TAG=$(git tag -l "v*-beta.*" | sort -V | tail -n 2 | head -n 1 || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
          else
            git log -10 --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
          fi
          
          echo "" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "⚠️ **This is a beta release. Features may still be in development.**" >> RELEASE_NOTES.md

      - name: Create Beta Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: "Beta Release - ${{ steps.create_tag.outputs.tag_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true

  build-cli:
    name: Build CLI - ${{ matrix.platform }}
    needs: create-beta-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            platform: linux-arm64
            goos: linux
            goarch: arm64
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: windows-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${{ needs.create-beta-release.outputs.tag_name }}"
          if [ "${{ matrix.goos }}" == "windows" ]; then
            OUTPUT_NAME="ts2go-${TAG_NAME}-${{ matrix.platform }}.exe"
            go build -ldflags "-s -w -X main.version=${TAG_NAME}" -o "${OUTPUT_NAME}" ./cmd/ts2go
            7z a "ts2go-${TAG_NAME}-${{ matrix.platform }}.zip" "${OUTPUT_NAME}" README.md
            ASSET_PATH="ts2go-${TAG_NAME}-${{ matrix.platform }}.zip"
          else
            OUTPUT_NAME="ts2go-${TAG_NAME}-${{ matrix.platform }}"
            go build -ldflags "-s -w -X main.version=${TAG_NAME}" -o "${OUTPUT_NAME}" ./cmd/ts2go
            tar czf "ts2go-${TAG_NAME}-${{ matrix.platform }}.tar.gz" "${OUTPUT_NAME}" README.md
            ASSET_PATH="ts2go-${TAG_NAME}-${{ matrix.platform }}.tar.gz"
          fi
          echo "ASSET_PATH=${ASSET_PATH}" >> $GITHUB_ENV
        shell: bash

      - name: Upload CLI Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-beta-release.outputs.tag_name }}
          files: ${{ env.ASSET_PATH }}

  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}
    needs: [create-beta-release, build-cli]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop-ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop-ui/src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install parser dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build CLI for bundling
        run: |
          go build -ldflags "-s -w" -o ts2go-cli ./cmd/ts2go
          mkdir -p desktop-ui/src-tauri/bin
          mv ts2go-cli desktop-ui/src-tauri/bin/

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-ui
          tagName: ${{ needs.create-beta-release.outputs.tag_name }}
          releaseId: ${{ needs.create-beta-release.outputs.tag_name }}
          args: ${{ matrix.args }}

  generate-checksums:
    name: Generate Checksums
    needs: [create-beta-release, build-cli, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all CLI release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ needs.create-beta-release.outputs.tag_name }}
          fileName: "ts2go-*"
          
      - name: Generate checksums for all artifacts
        run: |
          sha256sum ts2go-*.tar.gz ts2go-*.zip > checksums.txt 2>/dev/null || true
          if [ -s checksums.txt ]; then
            cat checksums.txt
          else
            echo "No CLI artifacts found to checksum"
          fi
        shell: bash

      - name: Upload checksums
        if: hashFiles('checksums.txt') != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-beta-release.outputs.tag_name }}
          files: checksums.txt

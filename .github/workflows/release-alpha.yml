name: Release Alpha (Feature Branches)

on:
  push:
    branches:
      - 'feature/**'
      - 'copilot/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci-*.yml'

permissions:
  contents: write

jobs:
  create-alpha-release:
    name: Create Alpha Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-release]')"
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create alpha tag
        id: create_tag
        run: |
          # Extract branch name and sanitize
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          
          # Get short commit SHA
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Create alpha version tag
          TAG_NAME="v0.0.0-alpha.${SAFE_BRANCH}.${SHORT_SHA}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Alpha release from ${BRANCH_NAME} (${SHORT_SHA})"
          git push origin "${TAG_NAME}"

      - name: Create Alpha Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: "Alpha Release - ${{ steps.create_tag.outputs.tag_name }}"
          body: |
            **Alpha Release from Feature Branch**
            
            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
            
            ⚠️ **This is an alpha release for testing purposes only.**
            
            Features and functionality may be incomplete or unstable.
            Not recommended for production use.
          draft: false
          prerelease: true

  build-cli:
    name: Build CLI - ${{ matrix.platform }}
    needs: create-alpha-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: windows-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${{ needs.create-alpha-release.outputs.tag_name }}"
          if [ "${{ matrix.goos }}" == "windows" ]; then
            OUTPUT_NAME="ts2go-${TAG_NAME}-${{ matrix.platform }}.exe"
            go build -ldflags "-s -w -X main.version=${TAG_NAME}" -o "${OUTPUT_NAME}" ./cmd/ts2go
            7z a "ts2go-${TAG_NAME}-${{ matrix.platform }}.zip" "${OUTPUT_NAME}" README.md
            ASSET_PATH="ts2go-${TAG_NAME}-${{ matrix.platform }}.zip"
          else
            OUTPUT_NAME="ts2go-${TAG_NAME}-${{ matrix.platform }}"
            go build -ldflags "-s -w -X main.version=${TAG_NAME}" -o "${OUTPUT_NAME}" ./cmd/ts2go
            tar czf "ts2go-${TAG_NAME}-${{ matrix.platform }}.tar.gz" "${OUTPUT_NAME}" README.md
            ASSET_PATH="ts2go-${TAG_NAME}-${{ matrix.platform }}.tar.gz"
          fi
          echo "ASSET_PATH=${ASSET_PATH}" >> $GITHUB_ENV
        shell: bash

      - name: Upload CLI Asset
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-alpha-release.outputs.tag_name }}
          files: ${{ env.ASSET_PATH }}

  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}
    needs: [create-alpha-release, build-cli]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean workspace and caches
        shell: bash
        run: |
          echo "Cleaning workspace to prevent file conflicts..."
          rm -rf release/ dist/ build/
          rm -rf desktop-ui/dist desktop-ui/src-tauri/target
          rm -rf desktop-ui/src-tauri/bin
          rm -rf ~/go/pkg/mod/golang.org/toolchain* || true
          rm -rf ~/go/pkg/mod/cache/download/golang.org/toolchain* || true
          rm -rf ~/.cargo/registry || true
          rm -rf ~/.cargo/git || true
          echo "✓ Workspace cleaned"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            cmd/ts2go/go.mod
            cmd/ts2go/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop-ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Add macOS universal targets (explicit)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          echo "✓ macOS universal targets installed"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop-ui/src-tauri -> target'
          cache-on-failure: false
          key: ${{ matrix.platform }}-rust-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install parser dependencies
        run: |
          cd internal/transpiler/parser
          npm ci

      - name: Build Desktop App using Makefile
        run: make build-desktop
        env:
          CARGO_INCREMENTAL: 0
          MACOSX_DEPLOYMENT_TARGET: '10.13'

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "Verifying build artifacts..."
          if [ "${{ matrix.platform }}" == "macos-latest" ]; then
            # Check .app bundle
            APP_PATH="desktop-ui/src-tauri/target/release/bundle/macos/TS2Go Desktop.app"
            if [ ! -d "$APP_PATH" ]; then
              echo "❌ ERROR: .app bundle not found"
              exit 1
            fi
            
            APP_SIZE=$(du -sm "$APP_PATH" | cut -f1)
            echo "📦 .app size: ${APP_SIZE}MB"
            
            if [ $APP_SIZE -lt 100 ]; then
              echo "❌ ERROR: .app too small (${APP_SIZE}MB, expected >100MB)"
              exit 1
            fi
            
            if [ $APP_SIZE -gt 180 ]; then
              echo "⚠️  WARNING: .app unusually large (${APP_SIZE}MB, expected ~125-150MB)"
              echo "  This might indicate duplicate binaries."
            fi
            
            # Check for Node.js
            if [ ! -f "$APP_PATH/Contents/Resources/bin/node" ]; then
              echo "❌ ERROR: Node.js runtime missing from .app"
              exit 1
            fi
            
            # Check for duplicate Node.js binaries
            NODE_COUNT=$(find "$APP_PATH/Contents/Resources/bin" -name "node*" -type f 2>/dev/null | grep -v node_modules | wc -l | tr -d ' ')
            echo "📊 Node.js binaries found: $NODE_COUNT"
            if [ $NODE_COUNT -gt 1 ]; then
              echo "⚠️  WARNING: Multiple Node.js binaries detected:"
              find "$APP_PATH/Contents/Resources/bin" -name "node*" -type f 2>/dev/null | grep -v node_modules
            fi
            
            # Check release artifacts
            ls -lah release/stable/macos/ || (echo "❌ macOS artifacts missing" && exit 1)
            
            # Check DMG if exists
            if [ -d "release/stable/macos" ]; then
              DMG_PATH=$(find release/stable/macos -name "*.dmg" 2>/dev/null | head -1)
              if [ -n "$DMG_PATH" ]; then
                DMG_SIZE=$(du -sm "$DMG_PATH" | cut -f1)
                echo "💿 DMG size: ${DMG_SIZE}MB"
                
                if [ $DMG_SIZE -lt 80 ]; then
                  echo "❌ ERROR: DMG too small (${DMG_SIZE}MB, expected >80MB)"
                  exit 1
                fi
              else
                echo "⚠️  No DMG found in release directory"
              fi
            fi
            
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            ls -lah release/stable/windows/ || (echo "❌ Windows artifacts missing" && exit 1)
          else
            ls -lah release/stable/linux/ || (echo "❌ Linux artifacts missing" && exit 1)
          fi

      - name: Upload Desktop artifacts to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-alpha-release.outputs.tag_name }}
          files: |
            release/stable/macos/*
            release/stable/windows/*
            release/stable/linux/*

  generate-checksums:
    name: Generate Checksums
    needs: [create-alpha-release, build-cli, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all CLI release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ needs.create-alpha-release.outputs.tag_name }}
          fileName: "ts2go-*"
          
      - name: Generate checksums for all artifacts
        run: |
          sha256sum ts2go-*.tar.gz ts2go-*.zip > checksums.txt 2>/dev/null || true
          if [ -s checksums.txt ]; then
            cat checksums.txt
          else
            echo "No CLI artifacts found to checksum"
          fi
        shell: bash

      - name: Upload checksums
        if: hashFiles('checksums.txt') != ''
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-alpha-release.outputs.tag_name }}
          files: checksums.txt

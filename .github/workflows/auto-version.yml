name: Auto Version & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/*.yml'
      - 'VERSION'

concurrency:
  group: auto-version-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-and-tag:
    name: Auto Version & Create Tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-release]') && !contains(github.event.head_commit.message, '[no-release]')"
    outputs:
      version: ${{ steps.bump_version.outputs.version }}
      tag_created: ${{ steps.check_tag.outputs.tag_exists == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current_version
        run: |
          if [ -f VERSION ]; then
            CURRENT_VERSION=$(cat VERSION)
          else
            # Fallback to git tags
            CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.1.0")
          fi
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"

      - name: Determine version bump
        id: bump_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # Parse current version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Determine bump type from commit message
          # Conventional commits: feat!, fix!, BREAKING CHANGE -> major
          #                       feat -> minor
          #                       fix, docs, style, refactor, perf, test, chore -> patch
          
          if echo "$COMMIT_MSG" | grep -qiE '(BREAKING CHANGE|feat!|fix!)'; then
            # Major version bump
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qiE '^(feat|feature)(\(.*\))?:'; then
            # Minor version bump
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          else
            # Patch version bump (default for any other commit)
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "bump_type=${BUMP_TYPE}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION} (${BUMP_TYPE} bump)"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.bump_version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.bump_version.outputs.version }} already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.bump_version.outputs.version }} does not exist"
          fi

      - name: Update VERSION file
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "${{ steps.bump_version.outputs.version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.version }} [skip-release]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.bump_version.outputs.version }}" -m "Release v${{ steps.bump_version.outputs.version }}"
          git push origin "v${{ steps.bump_version.outputs.version }}"
          echo "✅ Created and pushed tag v${{ steps.bump_version.outputs.version }}"

      - name: Trigger release workflow
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "Tag v${{ steps.bump_version.outputs.version }} created - release workflow will trigger automatically"

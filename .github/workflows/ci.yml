name: CI - Tests & Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: |
            go/go.sum
            saas/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            go/internal/transpiler/parser/package-lock.json
            packages/ui-shared/package-lock.json

      - name: Install parser dependencies
        run: |
          cd go/internal/transpiler/parser && npm ci

      - name: Go mod verify
        run: go work sync && go mod verify

      - name: Run go fmt
        run: |
          UNFORMATTED=$(find go -name "*.go" -not -path "*/fixtures/*" -exec gofmt -s -l {} +)
          if [ -n "$UNFORMATTED" ]; then
            echo "Code is not formatted. Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: |
          (cd go && go vet ./...)
          if [ -d "saas" ]; then (cd saas && go vet ./...); fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
          args: --timeout=5m ./go/...

      - name: Build Go CLI
        run: make build-go

      - name: Run Go tests
        run: |
          (cd go && go test -v -race ./...)

      - name: Frontend Quality Check
        run: |
          cd packages/ui-shared
          npm ci
          npm run type-check

